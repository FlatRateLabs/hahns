<!-- src/report.html — the H.A.H.N.S feedback / bug-report window (build.js copies it
     to docs/report.html). Opened as a popup by the panel's "Feedback" link / the
     Settings "Report a bug" button. It runs on GitHub Pages (its own origin, no
     restrictive CSP), so it CAN POST to the Cloudflare relay Worker, which creates
     a labeled GitHub issue using a token that never leaves the Worker.

     It sends ONLY what the tech types + the app version + the browser string — never
     any ELSA / repair-job / manual content. The gate string below is a soft
     anti-spam check (public by nature); the real gate is the Worker's origin check
     plus its private GitHub token. Build fills __WORKER_URL__ and __REPORT_GATE__. -->
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>H.A.H.N.S — Feedback</title>
<style>
  body{font:14px/1.5 system-ui,-apple-system,sans-serif;margin:0;padding:20px;
       background:#111;color:#eee}
  h1{font-size:16px;margin:0 0 4px}
  .sub{color:#9aa0a6;font-size:12.5px;margin:0 0 16px}
  label{display:block;font-size:12px;color:#c7c7c7;margin:14px 0 5px;font-weight:600}
  input[type=text],textarea{width:100%;box-sizing:border-box;background:#1b1b1b;
       border:1px solid #333;border-radius:8px;color:#eee;font:inherit;padding:9px 10px}
  textarea{min-height:120px;resize:vertical}
  input:focus,textarea:focus{outline:0;border-color:#2fb84d}
  .types{display:flex;gap:8px}
  .types button{flex:1;background:#1b1b1b;border:1px solid #333;color:#cdcdcd;
       font:600 13px system-ui;padding:9px;border-radius:8px;cursor:pointer}
  .types button.on{background:#123a20;border-color:#2fb84d;color:#7ee29a}
  .row{display:flex;gap:16px;align-items:flex-end;justify-content:space-between;margin-top:22px}
  .actions{display:flex;gap:10px}
  button.send{background:#2fb84d;color:#04210f;font:700 14px system-ui;border:0;
       border-radius:8px;padding:11px 20px;cursor:pointer}
  button.send:disabled{opacity:.5;cursor:default}
  button.cancel{background:#333;color:#ddd;font:700 14px system-ui;border:0;
       border-radius:8px;padding:11px 18px;cursor:pointer}
  #status{margin-top:16px;font-size:13px;min-height:18px}
  #status.err{color:#ff8a80}
  #status.ok{color:#7ee29a}
  a{color:#7ee29a}
  .foot{margin-top:18px;color:#7a7a7a;font-size:11px;line-height:1.4}
  #done{display:none;text-align:center;padding:20px 0}
  #done .big{font-size:18px;color:#7ee29a;margin-bottom:8px}
</style>

<div id="form">
  <h1>Report a bug or send feedback</h1>
  <p class="sub">Goes straight to the H.A.H.N.S developer. Nothing about the repair job is included — only what you type below.</p>

  <label>What is this?</label>
  <div class="types">
    <button type="button" id="tBug" class="on">🐞 Bug / problem</button>
    <button type="button" id="tFeature">💡 Feature request</button>
  </div>

  <label for="title">Short summary</label>
  <input type="text" id="title" maxlength="120" placeholder="e.g. Wrong wheel torque for 2019 Atlas">

  <label for="desc">Details <span style="color:#777;font-weight:400">(required)</span></label>
  <textarea id="desc" maxlength="5000" placeholder="What happened, what you expected, and any steps to reproduce it. For a feature: what would help you at the bay?"></textarea>

  <label for="name">Your name <span style="color:#777;font-weight:400">(optional)</span></label>
  <input type="text" id="name" maxlength="80" placeholder="">

  <label for="email">Your email <span style="color:#777;font-weight:400">(optional — so the dev can follow up)</span></label>
  <input type="email" id="email" maxlength="120" placeholder="you@example.com">

  <div class="row">
    <div class="actions">
      <button type="button" class="send" id="send">Send</button>
      <button type="button" class="cancel" id="cancel">Cancel</button>
    </div>
  </div>
  <div id="status"></div>
  <p class="foot">Your app version and browser are attached automatically to help with debugging.</p>
</div>

<div id="done">
  <div class="big">✓ Thanks — sent!</div>
  <div id="doneMsg"></div>
  <p style="margin-top:16px"><button type="button" class="cancel" id="close2">Close</button></p>
</div>

<script>
(function () {
  var WORKER = "__WORKER_URL__";
  var GATE = "__REPORT_GATE__";

  // Size the window to fit the content (no inner scroll), then recenter. We add
  // the window chrome (outer − inner height, i.e. the title bar) so the CONTENT
  // gets its full height, and cap to the screen so we never grow off-screen.
  // availLeft/Top keep us on the right monitor where supported. Run it more than
  // once (now + after load + a frame later) because the first synchronous read of
  // outerHeight/innerHeight can be a few px off before the popup settles — that
  // race left a tiny scroll on some opens. A small pad keeps us from ever landing
  // short (a hair of empty space beats a scrollbar).
  function fitWindow() {
    try {
      var w = 480;
      var sw = screen.availWidth || screen.width, sh = screen.availHeight || screen.height;
      var chrome = Math.max(0, (window.outerHeight || 0) - (window.innerHeight || 0));
      var need = Math.max(
        document.documentElement.scrollHeight || 0,
        (document.body && document.body.scrollHeight) || 0
      );
      var h = Math.min(need + chrome + 16, sh - 40);
      window.resizeTo(w, h);
      var sx = (typeof screen.availLeft === "number" ? screen.availLeft : 0);
      var sy = (typeof screen.availTop === "number" ? screen.availTop : 0);
      window.moveTo(sx + Math.max(0, Math.round((sw - w) / 2)), sy + Math.max(0, Math.round((sh - h) / 2)));
    } catch (e) {}
  }
  fitWindow();
  window.addEventListener("load", fitWindow);
  if (window.requestAnimationFrame) requestAnimationFrame(fitWindow);

  var version = "";
  try { version = new URLSearchParams(location.search).get("v") || ""; } catch (e) {}

  var type = "bug";
  var tBug = document.getElementById("tBug"), tFeature = document.getElementById("tFeature");
  tBug.onclick = function () { type = "bug"; tBug.classList.add("on"); tFeature.classList.remove("on"); };
  tFeature.onclick = function () { type = "feature"; tFeature.classList.add("on"); tBug.classList.remove("on"); };

  var send = document.getElementById("send"),
      statusEl = document.getElementById("status"),
      titleEl = document.getElementById("title"),
      descEl = document.getElementById("desc"),
      nameEl = document.getElementById("name"),
      emailEl = document.getElementById("email");

  function setStatus(msg, cls) { statusEl.textContent = msg; statusEl.className = cls || ""; }
  function close() { try { window.close(); } catch (e) {} }
  document.getElementById("cancel").onclick = close;
  document.getElementById("close2").onclick = close;

  // basic email shape: something@something.tld (no spaces). Deliberately simple —
  // just enough to reject typos/junk; the field stays optional (blank is fine).
  function looksEmail(s) { return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(s); }

  send.onclick = function () {
    var desc = (descEl.value || "").trim();
    if (!desc) { setStatus("Please add a few details before sending.", "err"); descEl.focus(); return; }
    var email = (emailEl.value || "").trim();
    if (email && !looksEmail(email)) { setStatus("That email doesn't look right — please fix it or leave it blank.", "err"); emailEl.focus(); return; }
    send.disabled = true;
    setStatus("Sending…", "");

    var payload = {
      gate: GATE,
      type: type,
      title: (titleEl.value || "").trim(),
      description: desc,
      name: (nameEl.value || "").trim(),
      email: email,
      version: version,
      ua: navigator.userAgent || ""
    };

    fetch(WORKER, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(payload)
    })
      .then(function (r) { return r.json().then(function (j) { return { ok: r.ok, j: j }; }); })
      .then(function (res) {
        if (res.ok && res.j && res.j.ok) {
          document.getElementById("form").style.display = "none";
          var d = document.getElementById("done"), dm = document.getElementById("doneMsg");
          d.style.display = "block";
          dm.innerHTML = res.j.url
            ? 'Your report was filed as <a href="' + res.j.url + '" target="_blank" rel="noopener">issue #' + res.j.number + "</a>."
            : "Your report was filed. Thank you!";
          return;
        }
        var err = res.j && res.j.error ? res.j.error : "unknown";
        setStatus("Couldn’t send (" + err + "). Please try again, or let the shop know.", "err");
        send.disabled = false;
      })
      .catch(function (e) {
        setStatus("Couldn’t reach the server. Check your connection and try again.", "err");
        send.disabled = false;
      });
  };

  descEl.focus();
})();
</script>
