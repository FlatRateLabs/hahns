<!-- src/update.html — the Hahns update window (build.js copies it to docs/update.html).
     Opened as a popup by the loader bookmarklet. It runs on GitHub Pages (its own
     origin, no restrictive CSP), so it CAN fetch app.js; it hands the code back to
     the ELSA page via postMessage, then closes itself.

     Behaviour:
       - re-drag needed (version.json `loader` > this bookmark's `lv`)
                                                -> ALERT + a button to the setup page
                                                   to re-drag the bookmark once (the
                                                   loader can't self-update). Priority.
       - first install (loader has no version)  -> fetch + hand over silently
       - already current                        -> say so, close
       - a newer version exists                 -> ASK the tech (installed vs latest,
                                                   Update now / Not now); only fetch on yes
     This page is always fetched fresh from Pages, so changing it reaches EVERY
     already-installed loader immediately — no re-drag needed for update.html itself.
     Fetches only Hahns's own files — never touches ELSA/manual content. -->
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>H.A.H.N.S update</title>
<style>
  body{font:14px/1.5 system-ui,-apple-system,sans-serif;margin:0;padding:18px;
       background:#111;color:#eee;text-align:center}
  #msg{font-weight:500;margin-bottom:12px}
  #vers{display:none;margin:10px 0}
  .vrow{margin:4px 0}
  .vrow span{color:#9aa0a6}
  .vrow b{font-weight:700}
  #cur{color:#e8e8e8}
  #latest{color:#2fb84d}
  /* "What's new" — the offered version's changes only */
  #whatsnew{display:none;text-align:left;margin:14px 0 4px;padding:12px 14px;
            background:#1b1b1b;border:1px solid #2a2a2a;border-radius:10px;
            max-height:230px;overflow:auto}
  #whatsnew .wn-h{font-weight:800;color:#2fb84d;margin:0 0 8px;font-size:13px}
  #whatsnew h4{margin:10px 0 4px;font-size:12px;text-transform:uppercase;
               letter-spacing:.04em;color:#9aa0a6}
  #whatsnew ul{margin:0 0 4px;padding-left:18px}
  #whatsnew li{margin:3px 0;font-size:12.5px;color:#dcdcdc}
  #whatsnew p{margin:4px 0;font-size:12.5px;color:#dcdcdc}
  #whatsnew p.note{color:#c9a94b}
  #whatsnew strong{color:#fff}
  #whatsnew code{background:#000;padding:0 4px;border-radius:4px;font-size:11.5px}
  /* one collapsible entry per skipped version (all collapsed by default) */
  #whatsnew .wn-item{border:1px solid #2b3550;border-radius:8px;margin:8px 0;background:#12182a;overflow:hidden}
  #whatsnew .wn-item>summary{cursor:pointer;list-style:none;padding:9px 12px;font-weight:800;
    color:#fff;font-size:12.5px;display:flex;align-items:center;gap:8px}
  #whatsnew .wn-item>summary::-webkit-details-marker{display:none}
  #whatsnew .wn-item>summary::before{content:'\25B8';color:#2fb84d;font-size:11px;
    display:inline-block;transition:transform .12s ease}
  #whatsnew .wn-item[open]>summary::before{transform:rotate(90deg)}
  #whatsnew .wn-item .wn-date{margin-left:auto;font-weight:600;color:#8a93a6;font-size:11px}
  #whatsnew .wn-body{padding:0 12px 8px}
  #whatsnew .wn-body h4:first-child{margin-top:2px}
  #btns{display:none;gap:10px;justify-content:center;margin-top:16px}
  button{font:700 14px system-ui;border:0;border-radius:8px;padding:10px 18px;cursor:pointer}
  #yes{background:#2fb84d;color:#04210f}
  #no{background:#333;color:#ddd}
</style>
<div id="msg">Checking for the latest H.A.H.N.S…</div>
<div id="vers">
  <div class="vrow"><span>Installed:</span> <b id="cur"></b></div>
  <div class="vrow"><span>Latest:</span> <b id="latest"></b></div>
</div>
<div id="whatsnew"></div>
<div id="btns">
  <button id="yes">Update now</button>
  <button id="no">Not now</button>
</div>
<script>
(function () {
  var opener = window.opener;
  var msg = document.getElementById("msg"),
      vers = document.getElementById("vers"),
      btns = document.getElementById("btns"),
      cur = document.getElementById("cur"),
      latestEl = document.getElementById("latest");

  function post(m){ try { opener.postMessage(m, "*"); } catch (e) { } }  // loader validates our origin
  function done(){ try { window.close(); } catch (e) { } }

  // Center the popup on the screen (the loader opens it wherever the browser
  // chooses; we recenter here so it always lands in the middle). Done in the popup,
  // NOT the loader, so it needs no re-drag. availLeft/availTop keep it on the right
  // monitor where supported.
  function centerWindow(w, h) {
    try {
      window.resizeTo(w, h);
      var sw = screen.availWidth || screen.width, sh = screen.availHeight || screen.height;
      var sx = (typeof screen.availLeft === "number" ? screen.availLeft : 0);
      var sy = (typeof screen.availTop === "number" ? screen.availTop : 0);
      window.moveTo(sx + Math.max(0, Math.round((sw - w) / 2)), sy + Math.max(0, Math.round((sh - h) / 2)));
    } catch (e) { }
  }

  if (!opener) { msg.textContent = "Opened directly — nothing to do."; setTimeout(done, 1200); return; }
  centerWindow(460, 540);

  var have = "", force = false, techLoader = 0;
  try {
    var qs = new URLSearchParams(location.search);
    have = qs.get("v") || "";
    force = qs.get("force") === "1";   // manual check from the app's Settings button
    techLoader = +(qs.get("lv")) || 0; // this bookmark's loader generation (0 = pre-lv loader)
  } catch (e) { }
  var cb = "?cb=" + Date.now();

  // compare two "0.5.9.1-beta"-style versions by numeric dotted parts only (leading
  // "v" and any -alpha/-beta suffix ignored). >0 if a is newer than b.
  function cmpVer(a, b) {
    var pa = String(a || "").replace(/^v/i, "").replace(/[^0-9.].*$/, "").split("."),
        pb = String(b || "").replace(/^v/i, "").replace(/[^0-9.].*$/, "").split(".");
    for (var i = 0; i < Math.max(pa.length, pb.length); i++) {
      var x = parseInt(pa[i], 10) || 0, y = parseInt(pb[i], 10) || 0;
      if (x !== y) return x - y;
    }
    return 0;
  }
  function verLabel(v) { v = String(v || ""); return /^v/i.test(v) ? v : "v" + v; }

  // "What's new": notes.json carries EVERY version entry (newest first). We show
  // each version NEWER than the tech's installed one, each as its own collapsed
  // dropdown so a tech who skipped several releases sees them all. Falls back to
  // the latest entry (expanded) when we can't tell what they're running.
  // Our own trusted content (never ELSA/manual) -> innerHTML is fine.
  var notesP = fetch("./notes.json" + cb).then(function (r) { return r.ok ? r.json() : null; }).catch(function () { return null; });
  function showWhatsNew() {
    var box = document.getElementById("whatsnew");
    notesP.then(function (n) {
      if (!n) return;
      var entries = (n.entries && n.entries.length) ? n.entries
        : (n.html ? [{ version: n.version, status: "", html: n.html }] : []);
      if (!entries.length) return;
      // versions strictly newer than what the tech is running
      var news = have ? entries.filter(function (e) { return cmpVer(e.version, have) > 0; }) : [];
      if (!news.length) {
        // can't tell (first install / unknown) -> just the latest, expanded
        var e0 = entries[0];
        box.innerHTML = "<div class='wn-h'>What’s new in " + verLabel(e0.version) + "</div>" + e0.html;
        box.style.display = "block";
        return;
      }
      var head = news.length === 1
        ? "<div class='wn-h'>What’s new in " + verLabel(news[0].version) + "</div>"
        : "<div class='wn-h'>" + news.length + " updates since " + verLabel(have) + "</div>";
      var body = news.map(function (e) {
        var date = (e.status && !/in progress/i.test(e.status)) ? " <span class='wn-date'>" + e.status + "</span>" : "";
        return "<details class='wn-item'><summary>" + verLabel(e.version) + date +
          "</summary><div class='wn-body'>" + e.html + "</div></details>";
      }).join("");
      box.innerHTML = head + body;
      box.style.display = "block";
    });
  }

  // Show the re-drag alert: a newer LOADER (bookmark) exists than the one running.
  // The loader can't update itself, so we hand the tech a button to the setup page
  // to re-drag once.
  //   - "Update the bookmark" FIRST delivers the new app to the CURRENT (old) loader
  //     via postMessage, so the cached app is already current — then sends them to
  //     the setup page to re-drag. That way re-dragging + reopening does NOT throw a
  //     second "newer version" prompt (a re-drag only swaps the bookmark/loader; the
  //     app code is cached separately and would otherwise still be behind).
  //   - "Not now" posts `dismissed` (sets the loader's throttle) so it won't nag
  //     again until the next check.
  function showRedrag(latest) {
    msg.innerHTML = "An updated H.A.H.N.S bookmark is ready.<br>Your bookmark can’t finish updating on its own — re-drag it once from the setup page.";
    cur.textContent = "v" + have;
    latestEl.textContent = "v" + latest;
    vers.style.display = "block";
    showWhatsNew();
    var y = document.getElementById("yes"), n = document.getElementById("no");
    y.textContent = "Update the bookmark";
    y.onclick = function () {
      btns.style.display = "none";
      var go = function () { try { window.resizeTo(900, 720); } catch (e) { } location.href = "./"; };
      // if the app is already current, only the loader is behind -> just re-drag
      if (!latest || have === latest) { go(); return; }
      // otherwise push the new app to the running (old) loader NOW, then re-drag,
      // so the freshly-dragged bookmark opens already up to date (no 2nd prompt)
      msg.textContent = "Getting the latest, then sending you to re-drag…";
      fetch("./app.js" + cb)
        .then(function (r) { if (!r.ok) throw new Error("app.js " + r.status); return r.text(); })
        .then(function (code) { if (code && code.length > 100) post({ source: "hahns-updater", version: latest, code: code }); })
        .catch(function () { /* delivery failed — the re-drag still fixes it on next check */ })
        .then(go);
    };
    n.textContent = "Not now";
    n.onclick = function () {
      post({ source: "hahns-updater", dismissed: true, version: latest });
      msg.textContent = "Okay — you can update the bookmark later from the setup page.";
      setTimeout(done, 1000);
    };
    btns.style.display = "flex";
  }

  // download the full app and hand it to the loader, then close
  function deliver(latest, okMsg) {
    return fetch("./app.js" + cb)
      .then(function (r) { if (!r.ok) throw new Error("app.js " + r.status); return r.text(); })
      .then(function (code) {
        if (!code || code.length < 100) throw new Error("empty app.js");
        post({ source: "hahns-updater", version: latest, code: code });
        msg.textContent = okMsg;
        setTimeout(done, 700);
      });
  }

  // 1) always fetch the tiny version file first
  fetch("./version.json" + cb)
    .then(function (r) { return r.ok ? r.json() : { version: "" }; })
    .catch(function () { return { version: "" }; })
    .then(function (vj) {
      var latest = (vj && vj.version) || "";
      var curLoader = +((vj && vj.loader) || 0);

      // re-drag needed -> the current release ships a NEWER loader than this
      // bookmark, and a loader can only change by re-dragging. Priority over the
      // app-version prompt (the re-drag brings the new app too). Never for a first
      // install (no `have`) — that just dragged the current loader.
      if (have && curLoader > techLoader) { showRedrag(latest); return; }

      // already current -> tell the loader, no download, no prompt
      if (have && latest && latest === have) {
        post({ source: "hahns-updater", upToDate: true, version: latest });
        msg.textContent = "H.A.H.N.S is up to date ✓";
        if (force) {
          // manual check: the tech clicked "Check for updates", so actually SHOW
          // the result (installed version + a Close button) instead of flashing shut
          cur.textContent = "v" + have;
          latestEl.textContent = "v" + latest;
          vers.style.display = "block";
          var y = document.getElementById("yes"), n = document.getElementById("no");
          y.style.display = "none";
          n.textContent = "Close";
          n.onclick = done;
          btns.style.display = "flex";
        } else {
          setTimeout(done, 600);
        }
        return;
      }

      // first install (loader has nothing yet) -> just get it
      if (!have) {
        msg.textContent = "Installing H.A.H.N.S…";
        return deliver(latest, "Installed ✓");
      }

      // a newer version exists -> ASK the tech
      msg.textContent = "A newer version of H.A.H.N.S is available.";
      cur.textContent = "v" + have;
      latestEl.textContent = "v" + latest;
      vers.style.display = "block";
      showWhatsNew();
      btns.style.display = "flex";
      document.getElementById("yes").onclick = function () {
        btns.style.display = "none";
        msg.textContent = "Updating…";
        deliver(latest, "Updated ✓");
      };
      document.getElementById("no").onclick = function () {
        post({ source: "hahns-updater", dismissed: true, version: latest });
        msg.textContent = "Okay — keeping your current version.";
        setTimeout(done, 900);
      };
    })
    .catch(function (e) {
      msg.textContent = "Couldn’t check for updates (" + String(e) + ").";
      setTimeout(done, 1600);
    });
})();
</script>
